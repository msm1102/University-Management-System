<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Payment</title>

    <link rel="stylesheet" href="fee_payment.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="header">

        <h1>Fee Payment</h1>

        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>

    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Fee</h3>
            <h2>৳60,000</h2>
        </div>

        <div class="card">
            <h3>Paid Amount</h3>
            <h2>৳45,000</h2>
        </div>

        <div class="card">
            <h3>Due Amount</h3>
            <h2>৳15,000</h2>
        </div>

        <div class="card">
            <h3>Payment Deadline</h3>
            <h2>15 Aug 2026</h2>
        </div>

    </div>

    <h2>Payment History</h2>

    <table>

        <thead>

        <tr>
            <th>Date</th>
            <th>Receipt No.</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Status</th>
        </tr>

        </thead>

        <tbody>

        <tr>
            <td>05 Aug 2026</td>
            <td>RC-10001</td>
            <td>৳20,000</td>
            <td>Bank</td>
            <td><span class="paid">Paid</span></td>
        </tr>

        <tr>
            <td>25 Jul 2026</td>
            <td>RC-10002</td>
            <td>৳25,000</td>
            <td>bKash</td>
            <td><span class="paid">Paid</span></td>
        </tr>

        </tbody>

    </table>

    <button class="download">
        <i class="fa-solid fa-download"></i>
        Download Receipt
    </button>

</div>

</body>
</html>
