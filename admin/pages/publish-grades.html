<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publish Grades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <h3 class="text-center text-white mt-3">
            UMS Admin
        </h3>

        <ul class="nav flex-column mt-4">

            <li class="nav-item">
                <a href="../dashboard.html" class="nav-link">
                    <i class="bi bi-house-door"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="course-schedule.html" class="nav-link">
                    <i class="bi bi-calendar-event"></i>
                    Course Schedule
                </a>
            </li>

            <li class="nav-item">
                <a href="fee-transactions.html" class="nav-link">
                    <i class="bi bi-cash-stack"></i>
                    Fee Transactions
                </a>
            </li>

            <li class="nav-item">
                <a href="publish-grades.html" class="nav-link active">
                    <i class="bi bi-journal-check"></i>
                    Publish Grades
                </a>
            </li>

            <li class="nav-item">
                <a href="students.html" class="nav-link">
                    <i class="bi bi-people"></i>
                    Students
                </a>
            </li>

            <li class="nav-item">
                <a href="faculty.html" class="nav-link">
                    <i class="bi bi-person-workspace"></i>
                    Faculty
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <nav class="navbar bg-white shadow-sm px-4">

            <h4>Publish Semester Grades</h4>

        </nav>

        <div class="container mt-4">

            <!-- Publish Grade Form -->

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Publish Student Grade

                </div>

                <div class="card-body">

                    <form id="gradeForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Student ID</label>

                                <input
                                type="text"
                                id="gradeStudentId"
                                class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Student Name</label>

                                <input
                                type="text"
                                id="gradeStudentName"
                                class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Course</label>

                                <input
                                type="text"
                                id="gradeCourse"
                                class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Semester</label>

                                <select
                                id="gradeSemester"
                                class="form-select">

                                    <option>Spring</option>
                                    <option>Summer</option>
                                    <option>Fall</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Grade</label>

                                <select
                                id="gradeGrade"
                                class="form-select">

                                    <option>A+</option>
                                    <option>A</option>
                                    <option>A-</option>
                                    <option>B+</option>
                                    <option>B</option>
                                    <option>C</option>
                                    <option>F</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>CGPA</label>

                                <input
                                type="text"
                                id="gradeCgpa"
                                class="form-control">

                            </div>

                        </div>

                        <button
                        type="button"
                        class="btn btn-success"
                        onclick="addGrade()">

                            Publish Grade

                        </button>

                    </form>

                </div>

            </div>

            <!-- Search Grade -->

            <div class="card shadow mt-4">

                <div class="card-body">

                    <input
                    type="text"
                    id="gradeSearch"
                    class="form-control"
                    placeholder="Search Grade"
                    onkeyup="searchGrade()">

                </div>

            </div>

            <!-- Published Grades Table -->

            <div class="card shadow mt-4">

                <div class="card-header bg-dark text-white">

                    Published Grades

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Semester</th>
                                <th>Grade</th>
                                <th>CGPA</th>
                                <th>Status</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="gradeTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/script.js"></script>

</body>

</html>
