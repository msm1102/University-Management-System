        <ul class="nav flex-column mt-4">

            <li class="nav-item">
                <a href="../dashboard.html" class="nav-link">
                    <i class="bi bi-house-door"></i>

                </a>
            </li>

            <li class="nav-item">
                <a href="course-schedule.html" class="nav-link">
                    <i class="bi bi-calendar-event"></i>
                    Course Schedule
                </a>
            </li>

            <li class="nav-item">
                <a href="fee-transactions.html" class="nav-link active">
                    <i class="bi bi-cash-stack"></i>
                    Fee Transactions
                </a>
            </li>

            <li class="nav-item">
                <a href="publish-grades.html" class="nav-link">

            <li class="nav-item">

    <!-- Main Content -->

    <div class="main-content">

        <nav class="navbar bg-white shadow-sm px-4">

            <h4>Pending Fee Transactions</h4>

        </nav>

        <div class="container mt-4">

            <!-- Search -->

            <div class="card shadow mb-4">

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-6">

                            <input type="text"
                            class="form-control"
                            placeholder="Search Student">

                        </div>

                        <div class="col-md-2">

                            <button class="btn btn-primary w-100">

                                Search

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Fee Table -->

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Pending Fee List

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Student Name</th>
                                <th>Department</th>
                                <th>Semester</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>221</td>
                                <td>Niloy Das</td>
                                <td>CSE</td>
                                <td>3rd</td>
                                <td>15,000 Tk</td>

                                <td>

                                    <span class="badge bg-warning">

                                        Pending

                                    </span>

                                </td>

                                <td>

                                    <button class="btn btn-success btn-sm">

                                        Approve

                                    </button>

                                    <button class="btn btn-danger btn-sm">

                                        Reject

                                    </button>

                                </td>

                            </tr>

                            <tr>

                                <td>222</td>
                                <td>Rahim</td>
                                <td>BBA</td>
                                <td>2nd</td>
                                <td>12,000 Tk</td>

                                <td>

                                    <span class="badge bg-success">

                                        Paid

                                    </span>

                                </td>

                                <td>

                                    <button class="btn btn-secondary btn-sm" disabled>

                                        Completed

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
