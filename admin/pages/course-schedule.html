<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Schedule</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <h3 class="text-center text-white mt-3">
            UMS Admin
        </h3>

        <ul class="nav flex-column mt-4">

            <li class="nav-item">
                <a href="../dashboard.html" class="nav-link">
                    <i class="bi bi-house-door"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="course-schedule.html" class="nav-link active">
                    <i class="bi bi-calendar-event"></i>
                    Course Schedule
                </a>
            </li>

            <li class="nav-item">
                <a href="fee-transactions.html" class="nav-link">
                    <i class="bi bi-cash-stack"></i>
                    Fee Transactions
                </a>
            </li>

            <li class="nav-item">
                <a href="publish-grades.html" class="nav-link">
                    <i class="bi bi-journal-check"></i>
                    Publish Grades
                </a>
            </li>

            <li class="nav-item">
                <a href="students.html" class="nav-link">
                    <i class="bi bi-people"></i>
                    Students
                </a>
            </li>

            <li class="nav-item">
                <a href="faculty.html" class="nav-link">
                    <i class="bi bi-person-workspace"></i>
                    Faculty
                </a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <nav class="navbar bg-white shadow-sm px-4">

            <h4>Course Schedule Management</h4>

        </nav>

        <div class="container mt-4">

            <!-- Add Course -->

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Add Course Schedule

                </div>

                <div class="card-body">

                    <form id="courseForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label>Course Code</label>
                                <input type="text" id="courseCode" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Course Name</label>
                                <input type="text" id="courseName" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Faculty Name</label>
                                <input type="text" id="courseFaculty" class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Semester</label>

                                <select id="courseSemester" class="form-select">
                                    <option>Spring</option>
                                    <option>Summer</option>
                                    <option>Fall</option>
                                </select>

                            </div>

                            <div class="col-md-4 mb-3">
                                <label>Room No</label>
                                <input type="text" id="courseRoom" class="form-control">
                            </div>

                            <div class="col-md-4 mb-3">

                                <label>Day</label>

                                <select id="courseDay" class="form-select">

                                    <option>Saturday</option>
                                    <option>Sunday</option>
                                    <option>Monday</option>
                                    <option>Tuesday</option>
                                    <option>Wednesday</option>

                                </select>

                            </div>

                            <div class="col-md-4 mb-3">
                                <label>Time</label>
                                <input type="time" id="courseTime" class="form-control">
                            </div>

                        </div>

                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="addCourse()">

                            Save Schedule

                        </button>

                    </form>

                </div>

            </div>

            <!-- Search -->

           <input
type="text"
id="courseSearch"
class="form-control"
placeholder="Search Course">
<button
type="button"
class="btn btn-primary w-100"
onclick="searchCourse()">
Search
</button>

            <!-- Course List -->

            <div class="card shadow mt-4">

                <div class="card-header bg-dark text-white">

                    Course Schedule List

                </div>

                <div class="card-body">

                    <table class="table table-bordered table-hover">

                        <thead>

                            <tr>

                                <th>Course Code</th>
                                <th>Course Name</th>
                                <th>Faculty</th>
                                <th>Semester</th>
                                <th>Room</th>
                                <th>Day</th>
                                <th>Time</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="courseTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/script.js"></script>

</body>
</html>
